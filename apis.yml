name: Lendsquare
description: Lendsquare was a community-lending / peer-to-peer lending startup surfaced as a portfolio
  company of 500 Global and added to the API Evangelist network as a stub for enrichment. The company
  is defunct. As of the 2026-07-19 enrichment pass lendsquare.com no longer hosts a product - the domain
  is parked on GoDaddy/Afternic nameservers (NS1.AFTERNIC.COM) and every path redirects to a "/lander"
  for-sale page, so there is no website, developer portal, documentation, or API surface to catalog. The
  only surviving first-party artifact is the dormant GitHub organization github.com/lendsquare, created
  2013-07-09 and last updated 2015-04-24, holding two Ruby repositories that are third-party libraries
  the team consumed rather than APIs it published - "area" (place / area-code / zip conversion) and
  "dwolla-ruby" (Dwolla's official Ruby API wrapper), the latter indicating Lendsquare moved money via
  the Dwolla API. This profile is retained as a historical, defunct record; no API artifacts were
  generated because none exist to capture.
